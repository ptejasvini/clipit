<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="description" content="A calm, private home for your images." />
    <title>Clipit — your image library</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body class="font-sans antialiased">
    <header class="border-b border-ink/10 bg-paper/90">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-5 sm:px-8">
        <a class="flex items-center gap-3" href="/" aria-label="Clipit home">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-forest text-white" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16.5z"/><circle cx="9" cy="9" r="1.2"/><path d="m6 16 4-4 2.5 2.5 2-2L18 16"/></svg>
          </span>
          <span class="font-display text-2xl leading-none">clipit<span class="text-coral">.</span></span>
        </a>
        <div class="flex items-center gap-2 text-xs font-medium uppercase tracking-[0.12em] text-forest">
          <span class="h-2 w-2 rounded-full bg-forest"></span>
          <span>Local library</span>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-5 pb-16 pt-10 sm:px-8 sm:pt-14">
      <section class="grid gap-8 lg:grid-cols-[1fr_0.78fr] lg:items-end">
        <div>
          <p class="mb-3 text-xs font-semibold uppercase tracking-[0.16em] text-forest">A little space for the things you see</p>
          <h1 class="max-w-xl font-display text-4xl leading-[1.08] text-ink sm:text-5xl">Your images,<br /><span class="text-forest">kept beautifully.</span></h1>
          <p class="mt-4 max-w-md text-sm leading-6 text-ink/65">Drop in a moment. Pick it up whenever you need it.</p>
        </div>

        <form id="upload-form" class="upload-zone rounded-2xl border border-dashed border-forest/35 bg-white/70 p-5 sm:p-6" aria-label="Upload an image">
          <input id="file-input" class="sr-only" type="file" accept="image/png,image/jpeg,image/gif" />
          <button id="pick-button" type="button" class="flex min-h-36 w-full flex-col items-center justify-center rounded-xl px-3 text-center outline-none focus-visible:ring-2 focus-visible:ring-forest">
            <span class="mb-3 grid h-11 w-11 place-items-center rounded-full bg-mint text-forest" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
            </span>
            <span class="font-medium text-ink">Choose an image <span class="font-normal text-ink/55">or drop it here</span></span>
            <span class="mt-1 text-xs text-ink/50">PNG, JPG or GIF · up to 2 MB</span>
          </button>
          <div id="upload-progress" class="mt-3 hidden" aria-live="polite">
            <div class="mb-2 flex justify-between gap-3 text-xs"><span id="progress-label" class="truncate text-ink/70"></span><span id="progress-value" class="shrink-0 font-medium text-forest">0%</span></div>
            <div class="h-1.5 overflow-hidden rounded-full bg-mint"><div id="progress-bar" class="h-full w-0 rounded-full bg-forest transition-[width] duration-200"></div></div>
          </div>
        </form>
      </section>

      <section class="mt-14 sm:mt-16" aria-labelledby="gallery-heading">
        <div class="mb-5 flex flex-col gap-4 border-b border-ink/10 pb-4 sm:flex-row sm:items-end sm:justify-between">
          <div class="flex items-baseline gap-3">
            <h2 id="gallery-heading" class="font-display text-2xl text-ink">Your library</h2>
            <span id="media-count" class="text-sm text-ink/45">—</span>
          </div>
          <label class="relative block sm:w-64">
            <span class="sr-only">Search images</span>
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ink/40" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg>
            <input id="search-input" type="search" placeholder="Find an image" class="w-full rounded-lg border border-ink/15 bg-white/80 py-2.5 pl-9 pr-3 text-sm outline-none transition focus:border-forest focus:ring-2 focus:ring-forest/10" />
          </label>
        </div>
        <div id="gallery" class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 lg:grid-cols-4" aria-live="polite"></div>
        <div id="empty-state" class="py-16 text-center">
          <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-mint text-forest" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2.5"/><circle cx="9" cy="9" r="1.5"/><path d="m5 17 5-5 3 3 2-2 4 4"/></svg>
          </div>
          <p id="empty-title" class="font-display text-xl text-ink">A fresh page</p>
          <p id="empty-description" class="mt-1 text-sm text-ink/55">Your uploaded images will find a home here.</p>
        </div>
      </section>
    </main>

    <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-10 -translate-x-1/2 translate-y-3 rounded-lg bg-ink px-4 py-3 text-sm text-white opacity-0 shadow-xl transition-all" role="status" aria-live="polite"></div>
  </body>
</html>
